spring.application.name=lily-book-club

#PORT
server.port=8080

#DATABASE
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#FLYWAY
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.url=${DB_URL}
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}


#JWT
jwt.secret-key=${JWT_SECRET_KEY}
jwt.expiry-duration=${JWT_EXPIRY_DURATION}
jwt.refresh-token-expiry-duration=${REFRESH_TOKEN_EXPIRY_DURATION}

#MAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
resend.api.key=${RESEND_API_KEY}
mail.name=Lily Book Club

#AI
GEMINI_API_KEY = ${GEMINI_API_KEY}

#APP LINK
app.base-url=${BASE_URL}/swagger-ui/index.html#/

#Kafka
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer