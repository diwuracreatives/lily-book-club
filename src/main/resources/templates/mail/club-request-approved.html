<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{mail/layout}">
<body>

<div layout:fragment="content">
  <section class="main-content">

    <h1>Your New Club Request has been Approved</h1>

    <p class="tagline"><span th:text="${greeting}"></span>, <span th:text="${firstname}"></span></p>

    <p class="pointer">Congrats! Your request to create book club <span th:text="${clubName}"></span> has been approved by our team.</p>

    <h3>Other things to know about your club:</h3>
    <ul>
      <li >Club Category: <span th:text="${clubCategory}"></span></li>
      <li >Club Code: <span th:text="${clubCode}"></span></li>
      <li >Club Description: <span th:text="${clubDescription}"></span></li>
      <li >Reading Day: <span th:text="${readingDay}"></span></li>
    </ul>

    <div class="action-btn">
      <button>
        <a th:href="${baseUrl} + 'Book%20Management/recommendBook' ">Add a book to your club</a>
      </button>
    </div>

  </section>
</div>

</body>
</html>
